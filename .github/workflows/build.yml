name: Build Cloudstream Extensions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (main branch)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare local.properties
        run: |
          cd src
          cp -n local.properties.example local.properties || touch local.properties

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Collect and Push Builds
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds"
          find "$GITHUB_WORKSPACE/src" -path "*/build/*" -name "plugins.json" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          find "$GITHUB_WORKSPACE/src" -path "*/build/*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;

          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build extensions (run #${{ github.run_number }})"
            git push origin HEAD:builds --force
          else
            echo "No changes in build outputs."
          fi
          
